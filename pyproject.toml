[project]
name = "tohoku"
version = "0.1.0"
description = "From Karakeep to Trilium: structured travel and recipe notes from saved Shorts, Reels and posts"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Fernando", email = "290854+KilFer@users.noreply.github.com" }]
keywords = ["karakeep", "trilium", "instagram", "youtube", "whisper", "llm", "travel", "recipes"]
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "typer>=0.12",
  "pyyaml>=6.0",
  "pillow>=10.4",
  "yt-dlp>=2025.1.1",
  "gallery-dl>=1.28",
  "faster-whisper>=1.1",
]

[project.scripts]
tohoku = "tohoku.cli:app"

[dependency-groups]
dev = ["pytest>=8.3", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tohoku"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = ["integration: tests against real services (opt-in)"]
addopts = "-m 'not integration'"

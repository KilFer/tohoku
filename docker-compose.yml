name: tohoku

services:
  tohoku:
    build: .
    image: tohoku:local
    container_name: tohoku
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      WHISPER_DOWNLOAD_ROOT: /models
      TZ: Europe/Madrid
    volumes:
      - ./data:/data
      - whisper-models:/models
      - ./secrets:/secrets:ro
      - ./config:/app/config:ro   # destinations and prompts editable without rebuilding (restart the container)
    networks:
      - pangolin
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 6g

networks:
  pangolin:
    external: true

volumes:
  whisper-models:   # → tohoku_whisper-models

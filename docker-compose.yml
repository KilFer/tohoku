name: tohoku

services:
  tohoku:
    build:
      context: .
      args:
        TZ: ${TZ:-UTC}
    image: tohoku:local
    container_name: tohoku
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      WHISPER_DOWNLOAD_ROOT: /models
      TZ: ${TZ:-UTC}
    volumes:
      - ./data:/data
      - whisper-models:/models
      - ./secrets:/secrets:ro
      - ./config:/app/config:ro   # destinations and prompts editable without rebuilding (restart the container)
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 6g

networks:
  app-network:
    name: ${DOCKER_NETWORK:-tohoku}
    external: true

volumes:
  whisper-models:   # → tohoku_whisper-models

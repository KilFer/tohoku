# Destinos de Tohoku: qué listas de Karakeep se procesan, con qué flujo y dónde se publican.
# Referencia: docs/superpowers/specs/2026-09-30-multi-destino-design.md §2 y docs/operations.md.
# Con un único destino no hace falta 'clasificador' ni 'destino_legado' (se toma ese destino).
# Con varios destinos, 'destino_legado' es obligatorio: el destino de los jobs anteriores a la fase 3.
# destino_legado: japon
# Ajustes del clasificador (todos opcionales; estos son los valores por defecto):
# clasificador:
#   modelo: null            # null = OPENROUTER_TEXT_MODEL
#   modo: json_schema
#   confianza_minima: 0.5
#   margen_revision: 0.15
# Limpieza (opcional; este es el valor por defecto). Al terminar un job (salvo error) se borran siempre sus
# ficheros (data/jobs/<id>/); el resultado de fetch se conserva (metadatos) marcado files_purged, y solo se
# vuelve a descargar si un reprocesado repite una etapa que necesita los ficheros. Los resultados de etapa se
# guardan 'retencion_dias' (0 = borrarlos todos al terminar). Nunca se borran la tabla jobs ni las publicaciones.
# limpieza:
#   retencion_dias: 30
listas:
  seo5xdpquppqfy4hmzzeekfh: [japon]   # lista "Japón" de Karakeep
  # <id-lista-recetas>: [recetas]        # lista de Karakeep de recetas (descomentar con el bloque `recetas`)
destinos:
  japon:
    flujo: viaje
    raiz: jrRoot                        # etiqueta de "Home › Viajes › Ideas de Japón"
    descripcion: "Viaje a Japón: lugares, comida, compras y cultura de Japón"
    prompt: prompts/japon.md
    pais: JP                            # el resto de parámetros del flujo viaje toman sus valores por defecto (Japón)
  # Recetas (fase 5, sin desplegar). Para activarlo: descomenta este bloque, la lista nueva de arriba
  # (en 'listas') y 'destino_legado: japon' (arriba, con varios destinos es obligatorio); crea la nota
  # raíz con #jrRootRecetas y ejecuta 'tohoku init-trilium --destino recetas'. Ver docs/flujos/receta.md.
  # recetas:
  #   flujo: receta
  #   raiz: jrRootRecetas                 # etiqueta de la nota raíz del Recetario en Trilium
  #   descripcion: "Recetas de cocina: platos y bebidas con ingredientes y pasos"
  #   prompt: prompts/recetas.md
  #   vista: table                        # table | grid | list (vista del Recetario)
  #   # atributos / atributos_usuario: opcionales (ver docs/flujos/receta.md)
